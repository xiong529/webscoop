name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q .

      - name: Unit tests (no browser / no network)
        run: python -X utf8 tests/run_all.py unit

      - name: E2E tests (local HTTP services)
        run: python -X utf8 tests/run_all.py e2e_stream e2e_mime e2e_retry e2e_scrapy_stats