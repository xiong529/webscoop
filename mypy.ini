[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
# Incremental adoption: strict on core modules only.
# To onboard a new module, add a [mypy-<module>] section with strict = True.
strict = False

[mypy-resources_reptile.utils.proxy]
strict = True

[mypy-resources_reptile.utils.cookies]
strict = True

[mypy-secret_store]
strict = True

[mypy-kvjournal]
strict = True

[mypy-download_archive]
strict = True

[mypy-dead_list]
strict = True

[mypy-format_selector]
strict = True